<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allure Reports Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --panel-alt: #1f2937;
            --accent: #38bdf8;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(180deg, #020817 0%, #0f172a 100%);
            color: var(--text);
        }

        .wrap {
            max-width: 1500px;
            margin: 0 auto;
            padding: 24px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 2rem;
            text-align: center;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .links a {
            text-decoration: none;
            color: var(--text);
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .links a:hover {
            background: rgba(56, 189, 248, 0.2);
            transform: translateY(-1px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(31, 41, 55, 0.9);
            border-bottom: 1px solid var(--border);
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .card-header a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        iframe {
            width: 100%;
            height: 820px;
            border: 0;
            background: white;
            display: block;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            iframe {
                height: 600px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>Allure Reports</h1>

        <div class="links">
            <a href="allure-html/production-readonly-20260928/index.html" target="_blank">Open Production Report</a>
            <a href="allure-html/security/index.html" target="_blank">Open Security Report</a>
        </div>

        <div class="grid">
            <section class="card">
                <div class="card-header">
                    <h2>Production</h2>
                    <a href="allure-html/production-readonly-20260928/index.html" target="_blank">Open in new tab</a>
                </div>
                <iframe src="allure-html/production-readonly-20260928/index.html" title="Production report"></iframe>
            </section>

            <section class="card">
                <div class="card-header">
                    <h2>Security</h2>
                    <a href="allure-html/security/index.html" target="_blank">Open in new tab</a>
                </div>
                <iframe src="allure-html/security/index.html" title="Security report"></iframe>
            </section>
        </div>
    </div>
</body>

</html>
